<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Flow</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GitHub Pages 404s on a client-side route, this page encodes
      // the path into a query string and redirects to index.html, where
      // a corresponding script decodes it and restores the original URL.
      var segmentCount = 1; // number of path segments in the repo name (/Order_flow = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
